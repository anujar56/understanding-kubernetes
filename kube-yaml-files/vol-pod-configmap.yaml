apiVersion: v1
kind: ConfigMap
metadata:
  name: config-app
data:
  APP_ENV: "PROD"
  APP_DEBUG: "false"
  config.properties: |
    max_connections=100
    timeout=30

---

apiVersion: v1
kind: Pod
metadata: 
  name: test-vol-pod
  labels:
    app: vol-app
spec:
  containers:
  - name: app-vol
    image: busybox:1.28
    command: ['sh','-c','tail -f /dev/null']
    volumeMounts:
    - name: vol-vol
      mountPath: /app/host
  
  volumes:
  - name: vol-vol
    configMap:
      name: config-app
